############################
########## Bindings
#############################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind ? display-popup -E -w 82 -h 25 "~/.config/tmux/help"
#############################
########## Settings
#############################
set -g mouse on # allow mouse scrolling
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-ghostty:sitm=\E[3m:ritm=\E[23m'
set -g status-style "fg=white,bg=default"
set -g message-style "fg=white,bg=default"
set -g status-left-length 20
set -g status-justify absolute-centre
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=white,bg=default,noreverse"
set -g status-left "\
#{?client_prefix,\
#[fg=blue]#[bg=default]#[fg=black]#[bg=blue]    󰋖    #[fg=blue]#[bg=default],\
#[fg=brightblack]#[bg=default]#[fg=black]#[bg=brightblack]  󰘴 & 󱁐 #[fg=brightblack]#[bg=default]\
}\
"
set -g status-right "#[fg=brightblack] #S "
set -g window-status-current-format '   #I:#W'
set -g window-status-format '  #[italics]#I:#W'
#############################
############# Zellij-style panes
#############################
# Split panes (no prefix needed)
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize panes with Alt+HJKL
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# Zoom/fullscreen toggle (like Zellij Alt+f)
bind -n M-f resize-pane -Z

# Close pane (like Zellij Alt+x)
bind -n M-x confirm-before -p "#[fg=red]#[bg=default]#[fg=black]#[bg=red]\uee15 Kill pane? (y/n)#[fg=red]#[bg=default]" kill-pane
#############################
############# Pane borders
#############################
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=green]/ 󰵮 /#[default],}"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set-hook -g window-layout-changed "if '[ #{window_panes} -gt 1 ]' 'set pane-border-status bottom' 'set pane-border-status off'"
#############################
############# Tmux Vars
#############################
