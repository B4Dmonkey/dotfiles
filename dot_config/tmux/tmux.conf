#############################
########## Bindings
#############################
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
bind ? display-popup -E -w 82 -h 25 "~/.config/tmux/help"
#############################
########## Palette
#############################
set -g @bg1     "#282c34"
set -g @bg2     "#3d424a"
set -g @fg_main "#e0dcd4"
set -g @fg_dim  "#b4c0c8"
# style = "fg:#b4c0c8 bg:#3d424a"
# [palettes.compline]
# bg1 = "#282c34"
# bg3 = "#515761"

# fg_main = "#e0dcd4"
# fg_dir  = "#ccc4b4"

# accent  = "#d3869b"
#############################
########## Settings
#############################
set -g mouse on # allow mouse scrolling
set -g status-style "fg=yellow,bg=#282c34"
set -g message-style "fg=#e0dcd4,bg=#282c34"
set -g message-command-style "fg=#e0dcd4,bg=#282c34"
set -g window-status-style "fg=yellow,bg=#282c34"
set -g window-status-current-style "fg=yellow,bg=#282c34"
set -g status-left "\
#{?client_prefix,\
#[bg=yellow]#[fg=#{@bg1}]  #[bg=#{@bg1}]#[fg=yellow]   󰋖  ,\
#[bg=yellow]#[fg=#{@bg1}]  #[bg=#{@bg1}]#[fg=yellow] 󰘴 & 󱁐 \
}\
"
set -g status-right "#[fg=yellow,bg=#{@bg1}]\ue0b6#[fg=#{@bg1},bg=yellow]#S#[fg=yellow,bg=#{@bg1}]\ue0b4 "
set -g window-status-current-format '    :#I:#W'
set -g window-status-format '    #I:#W'
#############################
############# Zellij-style panes
#############################
# Split panes (no prefix needed)
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize panes with Alt+HJKL
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# Zoom/fullscreen toggle (like Zellij Alt+f)
bind -n M-f resize-pane -Z

# Close pane (like Zellij Alt+x)
bind -n M-x confirm-before -p "#[fg=red] \uee15 Kill pane? #[fg=default](y/n)" kill-pane
#############################
############# Pane borders
#############################
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=green]/ 󰵮 /#[default],}"
set -g pane-active-border-style "fg=green"
set-hook -g window-layout-changed "if '[ #{window_panes} -gt 1 ]' 'set pane-border-status bottom' 'set pane-border-status off'"
#############################
############# Tmux Vars
#############################
