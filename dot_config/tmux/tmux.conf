############################
########## Bindings
#############################
unbind C-b
set -g prefix C-Space
bind ? display-popup -E -w 82 -h 25 "~/.config/tmux/help"
#############################
########## Settings
#############################
set -g mouse on # allow mouse scrolling
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-ghostty:sitm=\E[3m:ritm=\E[23m'
# fill= is what clears the rest of the status line under a message or
# prompt. tmux's default carries fill=yellow; setting message-style at all
# drops it, which left the leader hint bar showing through beside the
# kill-pane prompt. fill matches the bar so the line stays solid.
set -g message-style "fg=white,bg=#2d2a2e,fill=#2d2a2e"
#############################
########## Status bar
#############################
# The bar itself
set -g status-style "fg=white,bg=#2d2a2e"
set -g status-justify absolute-centre

# Left: leader indicator -- lock while idle, swaps while the leader is active.
# Branches are separate options because line continuation keeps leading whitespace.
set -g @status_left_leader_active  "#[fg=green] \uf09c "
set -g @status_left_leader_deactive "#[fg=brightblack]  "
set -g status-left " #{?client_prefix,#{@status_left_leader_active},#{@status_left_leader_deactive}}"
set -g status-left-length 20

# Right: session name and 12-hour clock
set -g status-right "#[fg=brightblack] #S · %-I:%M %p "

# Windows: name with the index as a subscript (zsh₁), pink on the current one --
# colour218 matches starship's dirty-git "*".
set -g @window_index_sub '#{s/0/₀/;s/1/₁/;s/2/₂/;s/3/₃/;s/4/₄/;s/5/₅/;s/6/₆/;s/7/₇/;s/8/₈/;s/9/₉/:window_index}'
set -g window-status-style "fg=brightblack"
set -g window-status-current-style "fg=white,bg=#2d2a2e,noreverse"
set -g window-status-format '  #[italics]#W#{E:@window_index_sub}'
set -g window-status-current-format '   #W#[fg=colour218]#{E:@window_index_sub}'
#############################
############# Zellij-style panes
#############################
# Split panes (no prefix needed)
bind -n M-| split-window -h -c "#{pane_current_path}"
bind -n M-- split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+hjkl
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Resize panes with Alt+HJKL
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# Zoom/fullscreen toggle (like Zellij Alt+f)
bind -n M-f resize-pane -Z

# Close pane (like Zellij Alt+x) and close window, both as the same red
# pill -- only the noun changes, so the caps and glyph live in one place.
# #{E:...} forces the second expansion pass the nested options need.
set -g @confirm_open  "#[fg=red]#[bg=default]#[fg=black]#[bg=red]\uee15 "
set -g @confirm_close "#[fg=red]#[bg=default]"
set -g @kill_pane_prompt   "#{@confirm_open}Kill pane? (y/n)#{@confirm_close}"
set -g @kill_window_prompt "#{@confirm_open}Kill window? (y/n)#{@confirm_close}"
bind -n M-x confirm-before -p "#{E:@kill_pane_prompt}" kill-pane
bind x      confirm-before -p "#{E:@kill_pane_prompt}" kill-pane
bind &      confirm-before -p "#{E:@kill_window_prompt}" kill-window
#############################
############# Pane borders
#############################
set -g pane-border-status off
set -g pane-border-format "#{?pane_active,#[fg=green]  #[default],}"
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set-hook -g window-layout-changed "if '[ #{window_panes} -gt 1 ]' 'set pane-border-status bottom' 'set pane-border-status off'"
#############################
########## Leader hint bar
#############################
# Two lines. The top one is tmux's stock status line on the solid bar colour.
# The bottom one sits on the terminal's own (transparent) background: the
# starship directory + git segment on the left, swapped for the powerline
# leader hints while the leader is armed, and the Alt-key pills on the right.
#
# @normal_status stashes that stock line rather than inlining it: a literal ","
# inside #{?...} needs escaping as "#," and the default is dense with them,
# while commas inside a #{...} replacement are exempt. The guard captures it
# only once -- on reload status-format[0] already points at @normal_status, and
# recapturing would make it refer to itself.
if -F "#{==:#{@normal_status},}" "set -gF @normal_status '#{status-format[0]}'"

# Palette. Every hint refers to these, so a colour changes in one place.
# Descriptions are italic, so the key style clears it explicitly -- #[italics]
# persists until something turns it off.
set -g @hint_k            "#[fg=green]#[noitalics]"
set -g @hint_d            "#[fg=colour250]#[italics]"
set -g @hint_sep          "#[fg=yellow]#[fg=colour250]"

# Caps: U+E0B6 / U+E0B4 half circles, U+E0B0 solid arrow for the green ->
# bar-background colour transition, U+E0B1 thin chevron between same-colour
# segments, U+EBC8 leader symbol.
set -g @hint_open         "#[fg=green]#[bg=green]#[fg=black] #[fg=green]#[bg=colour238]#[fg=colour250] "
set -g @hint_close        " #[fg=colour238]#[bg=terminal]#[fg=default]"

# The hints themselves. Edit the plain text; chevrons and colours come from the
# options above, so no glyphs or style codes need touching here.
set -g @hint_window       "#{@hint_k}c#{@hint_d} new #{@hint_sep} #{@hint_k}1-9#{@hint_d} go #{@hint_sep} #{@hint_k}n/p#{@hint_d} prev/next #{@hint_sep} #{@hint_k}l#{@hint_d} last #{@hint_sep} #{@hint_k},#{@hint_d} rename #{@hint_sep} #{@hint_k}&#{@hint_d} kill"
set -g @hint_session      "#{@hint_k}d#{@hint_d} detach #{@hint_sep} #{@hint_k}s#{@hint_d} sessions #{@hint_sep} #{@hint_k}w#{@hint_d} windows"
set -g @hint_misc         "#{@hint_k}:#{@hint_d} cmd #{@hint_sep} #{@hint_k}?#{@hint_d} help"

# Alt-key hints: one pill per binding, U+F0635 option symbol in green and the
# key in yellow. Caps and gaps use bg=terminal, not default: in the status line
# "default" means status-style's solid colour, and this line is transparent.
set -g @pill_open         "#[fg=colour238]#[bg=colour238]"
set -g @pill_close        "#[bg=terminal]#[fg=colour238]#[fg=default]"
set -g @hint_opt          "#{@hint_k}\U000f0635 #[fg=yellow]"
set -g @hint_meta         "#{@pill_open}#{E:@hint_opt}|#{@hint_d} split right#{@pill_close} #{@pill_open}#{E:@hint_opt}-#{@hint_d} split down#{@pill_close} #{@pill_open}#{E:@hint_opt}hjkl#{@hint_d} move#{@pill_close} #{@pill_open}#{E:@hint_opt}HJKL#{@hint_d} resize#{@pill_close} #{@pill_open}#{E:@hint_opt}f#{@hint_d} zoom#{@pill_close} #{@pill_open}#{E:@hint_opt}x#{@hint_d} close#{@pill_close}"

# #{E:...} forces the second expansion pass a nested format needs; plain
# #{@name} would render an inner #{@hint_sep} as literal text.
set -g @hint_leader       "#{E:@hint_open}#{E:@hint_window} #{@hint_sep} #{E:@hint_session} #{@hint_sep} #{E:@hint_misc}#{E:@hint_close} "

# starship's directory + git modules, restyled for tmux; see starship-segment.
set -g @starship_segment  "#(~/.config/tmux/starship-segment \"#{pane_current_path}\")"

set -g status 2
set -g status-format[0] "#{E:@normal_status}"
set -g status-format[1] "#[bg=terminal fill=terminal]#[align=left] #{?client_prefix,#{E:@hint_leader},#{E:@starship_segment}}#[align=right]#{E:@hint_meta} "
