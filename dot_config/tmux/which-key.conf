#############################
########## which-key
#############################
# Pressing the leader (C-Space) pops this menu up AND activates the prefix.
#
# `prefix None` in tmux.conf is required: tmux checks the prefix key BEFORE the
# root key table, so `bind -n C-Space` can never fire while C-Space is also the
# prefix. Unsetting it is what lets the leader reach a root binding at all.
#
# switch-client -T prefix arms the prefix key table for one key. That is what
# makes the prefix "active": it lights the status-left indicator and keeps every
# ordinary prefix binding reachable.
#
# Each item ends with `switch-client -T root` to release that armed prefix.
# Without it the one-shot switch is never consumed -- menu items bypass the key
# table -- so the NEXT key you typed would be eaten as a prefix binding.
#
# tmux draws this menu and matches the keys itself, so Space, function keys and
# blocking commands (confirm-before, command-prompt) all just work.
#
# Escape and q are bound as explicit items so dismissing the menu also releases
# the armed prefix. tmux closes the menu on those keys by default, but that path
# never consumes the one-shot switch-client -T prefix -- so the prefix stayed
# armed and the NEXT key you typed was read as a prefix binding (Escape then 's'
# would open the session chooser).
#
# The menu is deliberately kept short enough to fit a 24-row terminal: tmux does
# not scroll a menu, it refuses to display one that does not fit. `?` opens the
# full cheatsheet.

bind -n C-Space {
  switch-client -T prefix
  display-menu -x 0 -y S -S "fg=green" -T "#[align=centre,fg=green,bold] tmux " \
    "split right"   "|"     "split-window -h -c \"#{pane_current_path}\" ; switch-client -T root" \
    "split down"    "-"     "split-window -v -c \"#{pane_current_path}\" ; switch-client -T root" \
    "zoom"          "f"     "resize-pane -Z ; switch-client -T root" \
    "kill pane"     "x"     "confirm-before -p \"kill pane? (y/n)\" kill-pane ; switch-client -T root" \
    "" \
    "new window"    "c"     "new-window -c \"#{pane_current_path}\" ; switch-client -T root" \
    "next window"   "n"     "next-window ; switch-client -T root" \
    "prev window"   "p"     "previous-window ; switch-client -T root" \
    "rename window" ","     "command-prompt -I \"#W\" \"rename-window '%%'\" ; switch-client -T root" \
    "kill window"   "&"     "confirm-before -p \"kill window? (y/n)\" kill-window ; switch-client -T root" \
    "" \
    "detach"        "d"     "detach-client ; switch-client -T root" \
    "switch session" "s"    "choose-tree -Zs ; switch-client -T root" \
    "copy mode"     "["     "copy-mode ; switch-client -T root" \
    "cycle layout"  "Space" "next-layout ; switch-client -T root" \
    "" \
    "command prompt" ":"    "command-prompt ; switch-client -T root" \
    "reload"        "r"     "source-file -F \"#{d:current_file}/tmux.conf\" ; switch-client -T root" \
    "full help"     "?"     "display-popup -E -w 82 -h 25 \"~/.config/tmux/help\" ; switch-client -T root" \
    "" \
    "cancel"        "Escape" "switch-client -T root" \
    "cancel"        "q"      "switch-client -T root"
}
