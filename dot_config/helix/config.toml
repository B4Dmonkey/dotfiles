theme="monokai_pro"

[editor]
line-number="relative"
bufferline="multiple"
cursorline=true
end-of-line-diagnostics = "hint"
color-modes=true
shell=["zsh", "-c"]
rulers=[88,120]

[editor.cursor-shape]
insert="bar"
normal="block"
select="underline"

[editor.file-picker]
hidden=false

[editor.indent-guides]
render=false
skip-levels=2

[editor.inline-diagnostics]
cursor-line="error"

[editor.auto-save]
after-delay.enable=true
after-delay.timeout=1000

[editor.soft-wrap]
enable=true
# enable=false
# [editor.statusline]
# left=["mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator"]
# mode.normal="<NOR>"
# mode.select="SEL\ue0ba"
# separator=""

[keys.normal]
esc = ["collapse_selection","keep_primary_selection"]
