theme="monokai_pro"

[editor]
line-number="relative"
bufferline="multiple"
cursorline=true
end-of-line-diagnostics = "hint"
color-modes=true
rulers=[80, 120]

[editor.inline-diagnostics]
cursor-line="error"

[editor.cursor-shape]
insert="bar"
normal="block"
select="underline"

[editor.file-picker]
hidden=false

[editor.indent-guides]
render=true
skip-levels=1

[editor.auto-save]
after-delay.enable=true
after-delay.timeout=1000

[keys.normal]
esc = ["collapse_selection","keep_primary_selection"]

[editor.soft-wrap]
enable = true
